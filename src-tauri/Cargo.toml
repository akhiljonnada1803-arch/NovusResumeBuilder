[package]
name = "novus-resume-ai"
version = "1.0.0"
description = "Novus Resume AI - Professional AI Resume Builder & Developer Portfolio Platform"
authors = ["Novus AI Team <team@novusresume.ai>"]
license = "MIT"
repository = "https://github.com/novus-ai/novus-resume-ai"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-shell = "2.0.0"
tauri-plugin-deep-link = "2.0.0"
tauri-plugin-store = "2.0.0"
tauri-plugin-updater = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

[features]
custom-protocol = ["tauri/custom-protocol"]
