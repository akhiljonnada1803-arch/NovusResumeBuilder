name: "CI — Quality Gate"

# Runs on every push to main and every pull request
# Catches build errors, type errors, lint errors, and Rust compile errors
# BEFORE they reach a tagged release — preventing the v1.1 class of bugs

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # 1. TypeScript + Next.js Build Check
  # ─────────────────────────────────────────────
  typescript-and-build:
    name: "TS Type Check & Next.js Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check (strict, no skipLibCheck)
        run: npx tsc --noEmit

      - name: Next.js production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Provide dummy env vars so build doesn't fail on missing secrets
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder_anon_key"

  # ─────────────────────────────────────────────
  # 2. Rust / Tauri Backend Compile Check
  # Catches exactly the class of bugs that shipped in v1.1:
  #   - broken base64_decode stub
  #   - missing crate imports (open, Emitter)
  #   - invalid API calls (deep_link::register)
  # ─────────────────────────────────────────────
  rust-check:
    name: "Rust Compile Check (cargo check)"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config

      - name: Ensure frontend dist directory exists for Tauri build script
        run: mkdir -p .next

      - name: cargo check (fast compile validation — no binaries produced)
        working-directory: src-tauri
        run: cargo check

      - name: cargo clippy (lint)
        working-directory: src-tauri
        run: cargo clippy || true

  # ─────────────────────────────────────────────
  # 3. Unit & Integration Tests
  # ─────────────────────────────────────────────
  unit-tests:
    name: "Vitest Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder_anon_key"

  # ─────────────────────────────────────────────
  # 4. ESLint Code Quality Check
  # ─────────────────────────────────────────────
  lint:
    name: "ESLint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
