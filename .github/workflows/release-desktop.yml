name: "Release Desktop Application"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: "--bundles nsis,msi"
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            args: "--bundles dmg,app"
          - platform: "macos-13"
            target: "x86_64-apple-darwin"
            args: "--bundles dmg,app"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            args: "--bundles deb,appimage"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build Next.js Web Frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Novus Resume AI Desktop ${{ github.ref_name }}"
          releaseBody: "See the assets below to download the latest Novus Resume AI Desktop release for Windows, macOS, and Linux."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} --target ${{ matrix.target }}
